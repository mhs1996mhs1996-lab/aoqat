name: Check web preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - 'tests/**'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/check-web.yml'

permissions:
  contents: read

jobs:
  web-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check timing and web settings
        run: node --test tests/adhan-core.test.cjs tests/quran-pages.test.cjs tests/prayer-cache.test.cjs tests/prayer-alarm-core.test.cjs
      - name: Check web controls in Chrome
        run: |
          npm install --no-save --package-lock=false playwright
          node tests/adhan-modal-browser.cjs
          node tests/prayer-alarm-browser.cjs
          node tests/settings-scroll-browser.cjs
          node tests/adhan-browser.cjs
          node tests/adhan-scheduled-browser.cjs
          node tests/adhan-sections-browser.cjs
          node tests/quran-reader-browser.cjs
          node tests/quran-offline-browser.cjs
          node tests/iqama-native-browser.cjs
          node tests/design-persistence-browser.cjs
      - name: Upload web previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adhan-services-web-preview
          path: |
            /tmp/aoqat-adhan-*.png
            /tmp/aoqat-design-*.png
          if-no-files-found: ignore
