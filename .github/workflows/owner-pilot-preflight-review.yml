name: Owner pilot preflight — review only, NO PUBLISH
on:
  push:
    branches:
      - feature/b150-owner-pilot-release-gate-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/feature/b150-owner-pilot-release-gate-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify changed path scope against owner-approved B150 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base='dacf35169934b8b0173ee8b5215e0453343f1455'
          allowed={
            'security/owner-ota-preflight.py',
            'security/test-owner-ota-preflight.py',
            'security/OWNER-PILOT-RELEASE-GATE.md',
            '.github/workflows/owner-pilot-preflight-review.yml',
            '.github/workflows/owner-pilot-android-qa.yml',
            'android-native/app/src/main/java/com/aoqat/calendar/OwnerPilotBundle.kt',
            'android-native/app/src/main/java/com/aoqat/calendar/OwnerPilotActivity.kt',
            'android-native/app/src/main/java/com/aoqat/calendar/WebUpdates.kt',
            'android-native/app/src/main/java/com/aoqat/calendar/MainActivity.kt',
            'android-native/app/src/test/java/com/aoqat/calendar/OwnerPilotBundleTest.kt',
            'android-native/app/src/main/AndroidManifest.xml',
            'android-native/app/src/ownerPilot/AndroidManifest.xml',
            'android-native/app/build.gradle',
          }
          files=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert files and files.issubset(allowed), 'UNEXPECTED changed files: '+repr(files-allowed)
          print('PASS: no prayer app code, release manifest or production files changed')
          PY
      - name: Check private-key separation and sacred content
        run: |
          python3 security/check-no-private-keys.py
          python3 security/check-sacred-content.py
      - name: Test strict signed-OTA preflight without owner secrets
        run: |
          python3 security/test-owner-ota-preflight.py -v
          python3 -m py_compile security/owner-ota-preflight.py
      - name: Package signed last-approved production seq3 as OWNER-ONLY import smoke test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = '2015ca57aa0e8e4c4dd0a80dae94c5bf0e748d2a'
          mkdir -p review-phone-sample/android-updates/build-150/files
          git show origin/main:android-updates/build-150/manifest.json > review-phone-sample/android-updates/build-150/manifest.json
          git show origin/main:android-updates/build-150/files/index.html > review-phone-sample/android-updates/build-150/files/index.html
          python3 security/signed-update-manifest.py verify review-phone-sample/android-updates/build-150/manifest.json --public-key security/aoqat-update-public-v2.pem --build 150 --last-sequence 2
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          root=Path('review-phone-sample')
          base=root/'android-updates/build-150'
          m=json.loads((base/'manifest.json').read_text())
          assert m['nativeBuild']==150 and m['sequence']==3
          assert set(m['files'])=={'index.html'}
          assert hashlib.sha256((base/'files/index.html').read_bytes()).hexdigest()==m['files']['index.html']
          with zipfile.ZipFile('owner-b150-approved-seq3-signed-smoke-test.zip','x',zipfile.ZIP_DEFLATED) as out:
              for p in (base/'manifest.json',base/'files/index.html'):
                  out.write(p,p.relative_to(root).as_posix())
          print('PASS: exact currently published signed seq3 only; no new update created')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AOQAT-B150-SIGNED-SEQ3-OWNER-IMPORT-SMOKE-TEST
          path: owner-b150-approved-seq3-signed-smoke-test.zip
          retention-days: 7
          if-no-files-found: error
      - name: Record explicit deployment hold
        run: echo 'NO DEPLOYMENT. NO OWNER PHONE TEST. NO AUTO APPROVAL. NO VERCEL OR MAIN CHANGES.'
