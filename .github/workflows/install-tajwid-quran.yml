name: Install colored Tajwid Quran pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-tajwid-quran.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate user's released 604-page archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, zipfile, pathlib
          repo=os.environ['GH_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'aoqat-tajwid-installer'}
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/releases?per_page=30',headers=headers)
          releases=json.load(urllib.request.urlopen(req))
          asset=next((a for r in releases for a in r.get('assets',[]) if a['name']=='tajwid_604_pages.zip'),None)
          if not asset: raise SystemExit('Release asset tajwid_604_pages.zip not found. No files changed.')
          req=urllib.request.Request(asset['url'],headers={**headers,'Accept':'application/octet-stream'})
          with urllib.request.urlopen(req) as f: data=f.read()
          pathlib.Path('/tmp/tajwid.zip').write_bytes(data)
          target=pathlib.Path('assets/mushaf-tajwid')
          target.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile('/tmp/tajwid.zip') as z:
            names={n for n in z.namelist() if n.endswith('.webp')}
            expected={'tajwid_webp/'+str(i).zfill(3)+'.webp' for i in range(1,605)}
            if names!=expected: raise SystemExit('Expected exactly 604 numbered WebP pages; refusing partial installation.')
            for i in range(1,605):
              page=str(i).zfill(3)+'.webp'
              (target/page).write_bytes(z.read('tajwid_webp/'+page))
          pathlib.Path('assets/mushaf-tajwid-ready.json').write_text(json.dumps({'edition':'tajwid-hafs','pages':604},ensure_ascii=False)+'\n')
          print('Validated and installed all 604 Tajwid pages.')
          PY
      - name: Commit only Tajwid page assets and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mushaf-tajwid assets/mushaf-tajwid-ready.json
          if git diff --cached --quiet; then echo "Already installed"; else
            git commit -m "Install 604 colored Tajwid Quran page images"
            git push
          fi
