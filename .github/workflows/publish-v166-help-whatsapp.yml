name: Verify and publish APK v1.66 help WhatsApp
on:
  pull_request:
    paths:
      - '.github/workflows/publish-v166-help-whatsapp.yml'
permissions:
  contents: write
  actions: read
jobs:
  verify-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact support feature commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable Android signing key
        run: |
          mkdir -p android-native/signing
          base64 --decode android-native/signing/aoqat-stable-debug.keystore.b64 > android-native/signing/aoqat-stable-debug.keystore
      - name: Verify Arabic guide and WhatsApp handoff in Chrome
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          CHROME_PATH=/usr/bin/google-chrome node tests/help-support-browser.cjs
      - name: Build APK and run Android unit tests
        run: |
          set -euo pipefail
          gradle -p android-native --no-daemon testDebugUnitTest assembleDebug
      - name: Verify signature, version, contents and offline data
        run: |
          set -euo pipefail
          mkdir -p /tmp/aoqat-v166
          cp android-native/app/build/outputs/apk/debug/app-debug.apk /tmp/aoqat-v166/aoqat-v1.66-help-whatsapp.apk
          apk=/tmp/aoqat-v166/aoqat-v1.66-help-whatsapp.apk
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          "$signer" verify --verbose --print-certs "$apk"
          "$aapt" dump badging "$apk" | grep -F "versionCode='101' versionName='1.66'"
          python3 - <<'PY'
          import zipfile,hashlib,os
          p='/tmp/aoqat-v166/aoqat-v1.66-help-whatsapp.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              n=z.namelist()
              prefix='assets/www/'
              assert len([x for x in n if x.startswith(prefix+'assets/qcf-v2-page-fonts/p') and x.endswith('.woff2')])==604
              assert not any(x.startswith(prefix+'pages/') for x in n)
              help=z.read(prefix+'js/help-support.js').decode('utf8')
              menu=z.read(prefix+'js/web-menu-order.js').decode('utf8')
              idx=z.read(prefix+'index.html').decode('utf8')
              bundle=z.read(prefix+'js/apk-startup-bundle.js').decode('utf8')
              assert "WHATSAPP_NUMBER='9647832764696'" in help
              assert 'https://wa.me/' in help and 'AoqatHelpSupport' in help
              assert 'helpButton.onclick=supportView' in menu
              assert 'js/apk-startup-bundle.js' in idx
              assert 'AoqatHelpSupport' in bundle
              assert "WHATSAPP_NUMBER='9647832764696'" in bundle
              assert 'helpButton.onclick=supportView' in bundle
              assert 'تعليمات الاستخدام' in help and 'تواصل معنا' in help
              assert len(z.read(prefix+'data/prayer-times-offline.json'))>5000
              splash=z.read('assets/splash-hawija-original.jpg')
              assert hashlib.sha256(splash).hexdigest()=='50c329d2ed32afe65f01f62a06f1655fbee1971a50d72d3f5df7e8947835e3ba'
              print('PASS: WhatsApp, guide, 604 offline Quran pages, prayer DB, original splash; bytes:',os.stat(p).st_size)
          PY
          sha256sum "$apk" > /tmp/aoqat-v166/aoqat-v1.66.sha256
      - name: Download previous signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download v1.65-alarm-hardware-snooze --repo "$GH_REPO" --pattern '*.apk' --dir /tmp/aoqat-v166
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify in-place Android 16 upgrade and app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r /tmp/aoqat-v166/aoqat-v1.65-alarm-hardware-snooze.apk
            adb shell dumpsys package com.aoqat.calendar | grep -m1 'versionName=1.65'
            adb install -r /tmp/aoqat-v166/aoqat-v1.66-help-whatsapp.apk
            adb shell dumpsys package com.aoqat.calendar | grep -m1 'versionName=1.66'
            adb shell am start -n com.aoqat.calendar/.MainActivity
            alive=0
            for attempt in $(seq 1 20); do
              if adb shell pidof com.aoqat.calendar; then alive=1; break; fi
              sleep 1
            done
            if [ "$alive" -ne 1 ]; then
              adb logcat -d -t 400 | grep -E -A 12 'FATAL EXCEPTION|Process: com.aoqat.calendar|AndroidRuntime' || true
              echo 'App did not remain running after launch'
              exit 1
            fi
            echo 'PASS: v1.66 upgrades v1.65 and launches without clearing data'
      - name: Publish installable verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tag=v1.66-help-whatsapp
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --title "أوقات الصلاة في الحويجة v1.66 — التعليمات والتواصل عبر واتساب" --prerelease --notes 'تحديث Android فوق v1.65: تعليمات الاستخدام بدون إنترنت، والتواصل عبر واتساب مع رسالة جاهزة، مع الحفاظ على بيانات الصلاة والأذان والمصحف والتقاويم والمنبه. ملف APK للتثبيت المباشر.'
          fi
          gh release upload "$tag" /tmp/aoqat-v166/aoqat-v1.66-help-whatsapp.apk /tmp/aoqat-v166/aoqat-v1.66.sha256 --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx 'aoqat-v1.66-help-whatsapp.apk'
