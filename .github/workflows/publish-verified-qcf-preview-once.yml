name: Publish already-verified single-QCF Android preview
on:
  push:
    paths:
      - '.github/workflows/publish-verified-qcf-preview-once.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'mhs1996mhs1996-lab/aoqat'
    runs-on: ubuntu-22.04
    steps:
      - name: Download previously verified one-QCF APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12947437332/zip" \
            -o verified.zip
          unzip -j verified.zip 'app-debug.apk' -d extracted
          test -s extracted/app-debug.apk
          mv extracted/app-debug.apk aoqat-v1.58-qcf-only-test.apk
      - name: Publish installable APK, clearly marked test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.58-qcf-only-test >/dev/null 2>&1; then
            gh release upload v1.58-qcf-only-test aoqat-v1.58-qcf-only-test.apk --clobber
          else
            gh release create v1.58-qcf-only-test aoqat-v1.58-qcf-only-test.apk \
              --prerelease --target c651560e2dc2a65ad1b11d321945a47b00a99360 \
              --title 'Hawija QCF-only APK 1.58 (test)' \
              --notes '604 offline QCF V2 fonts. No legacy SVG pages or edition selector. The exact approved splash artwork is NOT included yet; this is NOT the final combined release.'
          fi
