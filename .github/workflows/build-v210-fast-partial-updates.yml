name: Legacy v2.10 signing path disabled in hardened security branch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refuse-compromised-legacy-release:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed instead of republishing with the exposed old APK key
        run: |
          echo "SECURITY HOLD: Legacy v2.10 publishing process used a publicly accessible signing keystore."
          echo "No new APK will be published until signature migration has been reviewed."
          exit 1
