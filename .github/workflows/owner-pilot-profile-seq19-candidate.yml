name: Owner pilot seq19 profile submenu candidate (UNSIGNED, trial only)
on:
  push:
    branches: [feature/owner-pilot-profile-menu-seq19-20261122]
    paths:
      - '.github/workflows/owner-pilot-profile-seq19-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'mhs1996mhs1996-lab/aoqat'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate scope, profile actions, and signed prior OTA
        shell: bash
        run: |
          set -euo pipefail
          python3 security/check-no-private-keys.py
          python3 security/check-sacred-content.py
          python3 security/owner-pilot-auto-ota-sign.py --self-test
          python3 -m py_compile security/owner-pilot-profile-seq19-release.py
          node --check android-updates/owner-pilot/build-150/files/js/web-menu-order.js
          node --check android-updates/owner-pilot/build-150/files/js/apk-startup-bundle.js
          git fetch origin owner-pilot-ota:refs/remotes/origin/owner-pilot-ota
          python3 security/owner-pilot-profile-seq19-release.py --candidate-dir pilot-profile-seq19-candidate
          node --check pilot-profile-seq19-candidate/check-web-menu-order.js
          node --check pilot-profile-seq19-candidate/check-apk-startup-bundle.js
          cp security/owner-pilot-auto-ota-sign.py pilot-profile-seq19-candidate/owner-pilot-auto-ota-sign.py
          python3 - <<'PY'
          import base64,hashlib,re,subprocess
          from pathlib import Path
          content=Path('android-native/app/src/main/java/com/aoqat/calendar/WebUpdates.kt').read_text()
          match=re.search(r'PILOT_SIGNING_PUBLIC_KEY_B64\s*=\s*"([^"]+)"',content)
          assert match
          der=base64.b64decode(match.group(1),validate=True)
          assert hashlib.sha256(der).hexdigest()=='a0acf8f0464bad18392073c47166937e68f72b732efa3e1299331d0bc43307ea'
          Path('pilot-profile-seq19-candidate/pilot-public.pem').write_bytes(
            subprocess.check_output(['openssl','pkey','-pubin','-inform','DER','-outform','PEM'],input=der))
          print('PASS: exact pilot signing key matches the installed Android binary')
          PY
      - name: Export review candidate without publishing or private key
        uses: actions/upload-artifact@v4
        with:
          name: AOQAT-OWNER-PILOT-PROFILE-SEQ19-UNSIGNED-CANDIDATE
          path: pilot-profile-seq19-candidate/
          retention-days: 10
          if-no-files-found: error
