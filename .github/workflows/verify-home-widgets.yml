name: Verify three home-screen widgets (staging only)
on:
  push:
    branches: [feature/v178-transparent-home-widgets-20261106]
    paths:
      - 'android-native/**'
      - '.github/workflows/verify-home-widgets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widgets:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the original Android signing identity
        run: |
          mkdir -p android-native/signing
          base64 --decode android-native/signing/aoqat-stable-debug.keystore.b64 > android-native/signing/aoqat-stable-debug.keystore
      - name: Run Android unit tests and compile signed staging APK
        run: gradle -p android-native --no-daemon testDebugUnitTest assembleDebug
      - name: Verify three providers and unchanged offline Quran and timing assets
        run: |
          python3 - <<'PY'
          import zipfile,re,pathlib,xml.etree.ElementTree as ET
          path=pathlib.Path('android-native/app/src/main')
          manifest=(path/'AndroidManifest.xml').read_text()
          src=(path/'java/com/aoqat/calendar/PrayerWidget.kt').read_text()
          for provider in ['PrayerWidget','FivePrayerWidget','IqamaCountdownWidget']:
              assert f'android:name=".{provider}"' in manifest, provider
              assert f'class {provider}:' in src, provider
          for name in ['prayer_widget','prayer_times_widget','prayer_iqama_widget']:
              node=ET.parse(path/f'res/layout/{name}.xml').getroot()
              assert node.attrib['{http://schemas.android.com/apk/res/android}background']=='@android:color/transparent'
          assert 'if(notification) Color.rgb(8,35,47) else Color.TRANSPARENT' in src
          for name in ['prayer_widget','prayer_times_widget','prayer_iqama_widget']:
              layout=(path/f'res/layout/{name}.xml').read_text()
              assert '#FFFFFFFF' in layout and 'bold' in layout, name
          apk='android-native/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              qcf=[n for n in z.namelist() if n.startswith('assets/www/assets/qcf-v2-page-fonts/p') and n.endswith('.woff2')]
              assert len(qcf)==604, f'Quran QCF pages: {len(qcf)}'
              assert len(z.read('assets/www/data/prayer-times-offline.json'))>5000
          print('Verified three transparent widgets, 604 unchanged Quran fonts and saved offline prayer timetable')
          PY
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          "$signer" verify --verbose --print-certs android-native/app/build/outputs/apk/debug/app-debug.apk
          "$aapt" dump xmltree android-native/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml | grep -E 'FivePrayerWidget|IqamaCountdownWidget|PrayerWidget'
      - name: Fetch previously installed compatible version
        run: |
          curl -fL --retry 3 'https://github.com/mhs1996mhs1996-lab/aoqat/releases/download/v1.77-persistent-alarm-screen-wake/aoqat-v1.77-persistent-alarm-screen-wake.apk' -o /tmp/aoqat-v177.apk
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation over v1.77 and all three providers on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r /tmp/aoqat-v177.apk
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.aoqat.calendar/.MainActivity
            sleep 5
            adb shell pidof com.aoqat.calendar
            adb shell dumpsys appwidget > /tmp/widgets-dump.txt
            grep -F 'com.aoqat.calendar.PrayerWidget' /tmp/widgets-dump.txt
            grep -F 'com.aoqat.calendar.FivePrayerWidget' /tmp/widgets-dump.txt
            grep -F 'com.aoqat.calendar.IqamaCountdownWidget' /tmp/widgets-dump.txt
      - name: Save verified staging APK (no public release)
        uses: actions/upload-artifact@v4
        with:
          name: aoqat-transparent-widgets-staging
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
