name: Package Hawija startup portrait once
on:
  push:
    branches: [fix/apk-calendar-splash-followup-20261030]
    paths:
      - 'android-native/generate-splash.py'
      - '.github/workflows/package-hawija-splash.yml'
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render actual Android splash PNG from existing approved app logo
        run: |
          python -m pip install --quiet Pillow
          python android-native/generate-splash.py --output /tmp/splash-hawija-approved.png
          python - <<'PY'
          from PIL import Image
          p='/tmp/splash-hawija-approved.png'
          image=Image.open(p)
          image.verify()
          assert Image.open(p).size==(711,1536)
          PY
      - name: Save native PNG as versioned GitHub source asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PNG="android-native/app/src/main/assets/splash-hawija-approved.png"
          existing="$(gh api "repos/$GH_REPO/contents/$PNG?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)"
          export SPLASH_EXISTING_SHA="$existing"
          python - <<'PY'
          import os,base64,json
          body={
            "message":"Bundle rendered Hawija startup portrait for Android APK",
            "branch":os.environ["GITHUB_REF_NAME"],
            "content":base64.b64encode(open('/tmp/splash-hawija-approved.png','rb').read()).decode('ascii')
          }
          if os.getenv("SPLASH_EXISTING_SHA"):
            body["sha"]=os.environ["SPLASH_EXISTING_SHA"]
          open('/tmp/aoqat-splash-upload.json','w').write(json.dumps(body))
          PY
          gh api -X PUT "repos/$GH_REPO/contents/$PNG" --input /tmp/aoqat-splash-upload.json --jq .content.sha
