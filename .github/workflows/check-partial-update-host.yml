name: Verify installed app update host
on:
  push:
    branches: [feature/partial-web-updates-v208-20261114]
    paths: ['.github/workflows/check-partial-update-host.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Check direct production update endpoint without redirect
        run: |
          python3 - <<'PY'
          import urllib.request, json
          url='https://aoqat.vercel.app/android-updates/manifest.json'
          try:
              with urllib.request.urlopen(url,timeout=18) as res:
                  print('STATUS',res.status,'URL',res.geturl(),'MIME',res.headers.get('content-type'))
                  payload=json.load(res)
                  print('EXISTING_BUILD',payload.get('nativeBuild'),'FILES',len(payload.get('files',{})))
                  assert res.status==200 and res.geturl()==url and isinstance(payload.get('files'),dict)
          except Exception as exc:
              print('UPDATE_ENDPOINT_NOT_READY',repr(exc))
              raise
          PY
