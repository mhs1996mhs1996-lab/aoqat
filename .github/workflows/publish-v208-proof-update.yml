name: Publish v2.08 proof-only partial update

on:
  push:
    branches: [feature/partial-web-updates-v208-20261114]
    paths: ['.github/workflows/publish-v208-proof-update.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aoqat-v208-partial-update-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check update-only marker source
        run: node --check scripts/partial-update-proof.js
      - name: Prepare Android web-layer snapshot
        run: python3 scripts/prepare-android-update.py
      - name: Verify compatibility, complete hashes, size, and proof isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, re
          root=Path('android-updates')
          m=json.loads((root/'manifest.json').read_text())
          assert m['nativeBuild']==143, 'Do not send an update to the wrong APK version'
          assert 1<=len(m['files'])<=250
          assert 'index.html' in m['files'] and 'js/partial-update-proof.js' in m['files']
          index=(root/'files/index.html').read_text()
          assert 'js/partial-update-proof.js' in index
          assert 'js/partial-update-proof.js' not in Path('index.html').read_text()
          assert 'تجربة التحديث الجزئي 01' in (root/'files/js/partial-update-proof.js').read_text()
          total=0
          for p,sha in m['files'].items():
              assert p=='index.html' or (re.fullmatch(r'(js|css)/[A-Za-z0-9_.\/-]+\.(js|css)',p) and '..' not in p)
              blob=(root/'files'/p).read_bytes()
              assert len(blob)<=6*1024*1024
              assert hashlib.sha256(blob).hexdigest()==sha, p
              total+=len(blob)
          assert total<=24*1024*1024
          canonical='\n'.join(f'{p}:{m["files"][p]}' for p in sorted(m['files']))
          assert hashlib.sha256(canonical.encode()).hexdigest()==m['revision']
          print(f'Verified {len(m["files"])} update-only files, {total:,} bytes, revision {m["revision"]}')
          PY
      - name: Publish only the android-updates directory to the main website branch
        run: |
          set -euo pipefail
          cp -a android-updates /tmp/aoqat-v208-proof-update
          git fetch origin main
          git checkout -B publish-android-web-update origin/main
          rm -rf android-updates
          cp -a /tmp/aoqat-v208-proof-update android-updates
          git add --all -- android-updates
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names, 'There is no new partial update to publish'
          assert all(path.startswith('android-updates/') for path in names), names
          print(f'Only android-updates changed: {len(names)} paths')
          PY
          git -c user.name='aoqat-partial-update-bot' -c user.email='actions@users.noreply.github.com' commit -m 'Publish APK v2.08 partial-update proof only [web-only]'
          git push origin HEAD:main
      - name: Check the live APK update endpoint
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          wanted=json.load(open('android-updates/manifest.json'))['revision']
          url='https://aoqat.vercel.app/android-updates/manifest.json'
          for number in range(1,13):
              try:
                  with urllib.request.urlopen(url,timeout=15) as res:
                      data=json.load(res)
                      got=data.get('revision')
                      print('Live check',number,'status',res.status,'nativeBuild',data.get('nativeBuild'),'revision',got,flush=True)
                      if res.status==200 and data.get('nativeBuild')==143 and got==wanted:
                          print('LIVE_UPDATE_VERIFIED',flush=True)
                          break
              except Exception as exc:
                  print('Live check',number,repr(exc),flush=True)
              time.sleep(10)
          else:
              raise SystemExit('Published on GitHub but Vercel endpoint revision not confirmed yet')
          PY
