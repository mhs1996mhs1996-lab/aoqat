name: Check offline Android without APK build
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - 'data/prayer-times-offline*'
      - '.github/workflows/check-offline-android.yml'
permissions:
  contents: read
jobs:
  android-unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Android logic and packaged offline assets
        run: gradle -p android-native --no-daemon testDebugUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-android-tests
          path: android-native/app/build/reports/tests/testDebugUnitTest
