name: Build Android APK
# rebuild after restoring v1.20 wrapper identity
# Rebuild Friday-morning safe snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'assets/**'
      - 'pages/**'
      - 'manifest.webmanifest'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare deterministic Android signing key
        run: |
          mkdir -p android-native/signing
          base64 --decode android-native/signing/aoqat-stable-debug.keystore.b64 > android-native/signing/aoqat-stable-debug.keystore

      - name: Restore original v1.20 launcher icon
        run: |
          python3 - <<'PY'
          import base64, pathlib
          data = pathlib.Path("android-native/app_icon.b64").read_text().strip()
          out = pathlib.Path("android-native/app/src/main/res/drawable/app_icon.jpg")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(base64.b64decode(data))
          PY

      - name: Build and verify debug APK
        run: |
          gradle -p android-native --no-daemon assembleDebug
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)
          echo "Verifying APK signature..."
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Inspecting APK package..."
          "$AAPT" dump badging "$APK" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aoqat-android-v1.18
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
