name: Build Android APK
# rebuild after restoring v1.20 wrapper identity
# Rebuild Friday-morning safe snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'assets/**'
      - 'pages/**'
      - 'manifest.webmanifest'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare deterministic Android signing key
        run: |
          mkdir -p android-native/signing
          base64 --decode android-native/signing/aoqat-stable-debug.keystore.b64 > android-native/signing/aoqat-stable-debug.keystore

      - name: Restore original v1.20 adaptive launcher icon
        run: |
          python3 - <<'PY'
          import base64, pathlib
          root = pathlib.Path("android-native/app/src/main/res")
          data = pathlib.Path("android-native/app_icon.b64").read_text().strip()
          (root/"drawable").mkdir(parents=True, exist_ok=True)
          (root/"mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          (root/"mipmap-anydpi").mkdir(parents=True, exist_ok=True)
          (root/"drawable"/"app_icon.jpg").write_bytes(base64.b64decode(data))
          (root/"drawable"/"app_icon_foreground.xml").write_text("""<inset xmlns:android="http://schemas.android.com/apk/res/android" android:drawable="@drawable/app_icon" android:inset="18%" />""")
          adaptive = """<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/app_icon_background"/><foreground android:drawable="@drawable/app_icon_foreground"/></adaptive-icon>"""
          (root/"drawable"/"app_icon_background.xml").write_text("""<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#0B3D2E"/></shape>""")
          (root/"mipmap-anydpi-v26"/"ic_launcher.xml").write_text(adaptive)
          (root/"mipmap-anydpi-v26"/"ic_launcher_round.xml").write_text(adaptive)
          legacy = """<inset xmlns:android="http://schemas.android.com/apk/res/android" android:drawable="@drawable/app_icon" android:inset="8%" />"""
          (root/"mipmap-anydpi"/"ic_launcher.xml").write_text(legacy)
          (root/"mipmap-anydpi"/"ic_launcher_round.xml").write_text(legacy)
          PY

      - name: Build and verify debug APK
        run: |
          gradle -p android-native --no-daemon assembleDebug
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)
          echo "Verifying APK signature..."
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Inspecting APK package..."
          "$AAPT" dump badging "$APK" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aoqat-android-v1.18
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
