name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - 'assets/**'
      - 'pages/**'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[web-only]')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare deterministic Android signing key
        run: |
          mkdir -p android-native/signing
          base64 --decode android-native/signing/aoqat-stable-debug.keystore.b64 > android-native/signing/aoqat-stable-debug.keystore

      - name: Check prayer timing and web settings
        run: node --test tests/quran-pages.test.cjs tests/adhan-core.test.cjs tests/prayer-cache.test.cjs tests/prayer-alarm-core.test.cjs tests/friday-core.test.cjs

      - name: Build debug APK
        run: gradle -p android-native --no-daemon testDebugUnitTest assembleDebug

      - name: Verify installation file and complete offline package
        run: |
          python3 - <<'PYCODE'
          import zipfile,json,hashlib,pathlib
          apk=pathlib.Path('android-native/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              prefix='assets/www/'
              fonts=[n for n in z.namelist() if n.startswith(prefix+'assets/qcf-v2-page-fonts/p') and n.endswith('.woff2')]
              assert len(fonts)==604, f'Incomplete QCF V2 fonts: {len(fonts)}'
              assert prefix+'experiments/qcf604-web-verse-layouts.json.gz.bin' in z.namelist()
              assert not any(n.startswith(prefix+'assets/mushaf-phone-hafs/') or n.startswith(prefix+'pages/') for n in z.namelist()), 'Legacy SVG Quran pages packaged'
              hashes=json.loads(z.read(prefix+'assets/mushaf-apk-sha256.json'))
              for path,digest in hashes.items():
                  packaged=prefix+path+('.bin' if path.endswith('.gz') else '')
                  assert hashlib.sha256(z.read(packaged)).hexdigest()==digest, path
              rows=json.loads(z.read(prefix+'data/prayer-times-offline.json'))
              assert len(rows)==366
              row=next(r for r in rows if r['gregorian_month']==12 and r['gregorian_day']==30)
              assert [row[k] for k in ['fajr','sunrise','dhuhr','asr','maghrib','isha']]==['5:58','7:14','12:12','2:48','5:06','6:26']
              assert 'configurePrayerNotifications' in z.read(prefix+'js/prayer-alert-methods.js').decode()
              bundle=z.read(prefix+'js/apk-startup-bundle.js').decode()
              for token in ['aoqatRefreshNativeReminders','AoqatCommunityPosts','AoqatFastingPostsCalendar','aoqatNativeImageAction','مشاركة التصميم','aoqatCreatePrayerShareView','sharePrayerImage','aoqatRenderAzkar','adAzkarPrev','aoqatWebButtonAppearanceV1']:
                  assert token in bundle, token
              assert 'الصفحة الورقية القديمة' not in bundle
              assert 'const webOnly=true' in bundle
              assert 'if(window.AndroidNative?.configureAdhan)return;' not in z.read(prefix+'js/azkar-web.js').decode()
              assert 'native)return;const now'  in z.read(prefix+'js/prayer-alert-methods.js').decode()
          print('Verified: 604 QCF V2 fonts, no legacy SVG edition, annual offline database, native alerts; APK bytes:',apk.stat().st_size)
          PYCODE
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$signer" verify --print-certs android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare downloadable APK parts
        run: |
          mkdir -p android-native/app/build/apk-transfer
          split -b 350M android-native/app/build/outputs/apk/debug/app-debug.apk android-native/app/build/apk-transfer/aoqat-v1.58.apk.part-
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk > android-native/app/build/apk-transfer/aoqat-v1.58.sha256

      - name: Upload APK transfer part 1
        uses: actions/upload-artifact@v4
        with:
          name: aoqat-v1.58-part-1
          path: android-native/app/build/apk-transfer/aoqat-v1.58.apk.part-aa
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK transfer part 2
        uses: actions/upload-artifact@v4
        with:
          name: aoqat-v1.58-part-2
          path: |
            android-native/app/build/apk-transfer/aoqat-v1.58.apk.part-ab
            android-native/app/build/apk-transfer/aoqat-v1.58.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aoqat-android-v1.58-build93
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
# Redeploy Friday web baseline 2026-09-19

  web-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check web controls in Chrome
        run: |
          npm install --no-save --package-lock=false playwright
          node tests/quran-reader-browser.cjs
          node tests/quran-offline-browser.cjs
          node tests/friday-browser.cjs
          node tests/adhan-rollover-browser.cjs
          node tests/settings-subwindows-browser.cjs
          node tests/adhan-modal-browser.cjs
          node tests/prayer-alarm-browser.cjs
          node tests/apk-services-browser.cjs
          node tests/apk-reminders-focus-browser.cjs
          node tests/apk-day-rollover-browser.cjs
          node tests/adhan-browser.cjs
          node tests/adhan-scheduled-browser.cjs
          node tests/iqama-native-browser.cjs
          node tests/design-persistence-browser.cjs
      - name: Upload web preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adhan-web-preview
          path: |
            /tmp/aoqat-adhan-*.png
            /tmp/aoqat-design-*.png
          if-no-files-found: ignore




# Rebuild requested 2026-10-26: full offline Android APK, preserve app and web source
# Allow 60 minutes for 604-page offline packaging and APK artifact upload

  release-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify changed interface, calendars and native integrations
        run: |
          npm install --no-save --package-lock=false playwright
          node tests/interface-pages-browser.cjs
          node tests/font-retention-browser.cjs
          node tests/prayer-alert-methods-browser.cjs
          node tests/apk-release-browser.cjs
          node tests/apk-reminders-focus-browser.cjs
          node tests/apk-day-rollover-browser.cjs
          node tests/monthly-calendars-browser.cjs
