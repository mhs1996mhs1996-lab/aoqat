name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - 'js/prayer-alarm.js'
      - 'js/prayer-alarm-core.js'
      - 'css/prayer-alarm.css'
      - 'css/adhan-modal.css'
      - 'js/web-menu-order.js'
      - 'tests/apk-services-browser.cjs'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare deterministic Android signing key
        run: |
          mkdir -p android-native/signing
          base64 --decode android-native/signing/aoqat-stable-debug.keystore.b64 > android-native/signing/aoqat-stable-debug.keystore

      - name: Check prayer timing and web settings
        run: node --test tests/adhan-core.test.cjs tests/prayer-cache.test.cjs tests/prayer-alarm-core.test.cjs

      - name: Build debug APK
        run: gradle -p android-native --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aoqat-android-v1.34-build69
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
# Redeploy Friday web baseline 2026-09-19

  web-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check web controls in Chrome
        run: |
          npm install --no-save --package-lock=false playwright
          node tests/adhan-modal-browser.cjs
          node tests/prayer-alarm-browser.cjs
          node tests/apk-services-browser.cjs
          node tests/adhan-browser.cjs
          node tests/adhan-scheduled-browser.cjs
          node tests/iqama-native-browser.cjs
          node tests/design-persistence-browser.cjs
      - name: Upload web preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adhan-web-preview
          path: |
            /tmp/aoqat-adhan-*.png
            /tmp/aoqat-design-*.png
          if-no-files-found: ignore
