name: Prepare responsive native Hafs web rows
on:
  push:
    branches: ['quran-responsive-hafs-web']
    paths: ['scripts/render-responsive-hafs.py', '.github/workflows/prepare-responsive-mushaf.yml']
permissions:
  contents: write
jobs:
  responsive-pages:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build verified native outlines and responsive rows
        run: |
          python -m pip install fonttools==4.61.1 uharfbuzz==0.56.3
          python scripts/render-responsive-hafs.py
      - name: Check reader, source coverage and offline use
        run: |
          npm install --no-save --package-lock=false playwright
          node --test tests/quran-pages.test.cjs tests/quran-original-pages.test.cjs tests/quran-pocket-pages.test.cjs tests/quran-responsive-pages.test.cjs
          node tests/quran-reader-browser.cjs
          node tests/quran-offline-browser.cjs
      - name: Preserve verified web assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mushaf-phone-hafs assets/mushaf-phone-hafs-ready.json assets/mushaf-phone-hafs.json.gz
          git commit -m 'Bundle 604 responsive pages from verified original QCF2 outlines'
          git push origin HEAD:quran-responsive-hafs-web
      - name: Upload responsive phone previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-hafs-web-previews
          path: /tmp/aoqat-responsive-*.png
          if-no-files-found: ignore
