name: Diagnose published APK v1.61 install/parsing error
on:
  pull_request:
    paths: ['.github/workflows/diagnose-v161-installer.yml']
permissions:
  contents: read
jobs:
  inspect-real-release-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch actual public release APKs, not intermediate build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/aoqat-check/v161 /tmp/aoqat-check/v160
          gh release download v1.61-original-hawija-splash --repo "$GH_REPO" --dir /tmp/aoqat-check/v161
          gh release download v1.60-hawija-splash-calendar --repo "$GH_REPO" --dir /tmp/aoqat-check/v160
          ls -lh /tmp/aoqat-check/v161 /tmp/aoqat-check/v160
          sha256sum /tmp/aoqat-check/v161/*.apk /tmp/aoqat-check/v160/*.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct,hashlib,re
          for tag in ('v161','v160'):
              folder=Path('/tmp/aoqat-check')/tag
              apk=next(folder.glob('*.apk'))
              expected=(next(folder.glob('*.sha256'))).read_text().split()[0]
              actual=hashlib.sha256(apk.read_bytes()).hexdigest()
              print(tag,'SHA256 checksum matches published manifest:',expected==actual)
              assert expected==actual, f'RELEASE ASSET SHA MISMATCH {tag}'
              with zipfile.ZipFile(apk,'r') as z:
                  bad=z.testzip()
                  print(tag,'zip corruption:',bad,'entries:',len(z.namelist()),'total bytes:',apk.stat().st_size)
                  assert not bad, f'ZIP CRC FAIL {tag}: {bad}'
                  assert 'AndroidManifest.xml' in z.namelist()
                  assert 'classes.dex' in z.namelist()
                  assert any(x.startswith('META-INF/') for x in z.namelist())
                  if tag=='v161':
                      jpg=z.read('assets/splash-hawija-original.jpg')
                      assert jpg[:2]==bytes.fromhex('ffd8') and jpg[-2:]==bytes.fromhex('ffd9')
                      print('Original splash JPG embedded:',len(jpg),'bytes')
          PY
      - name: Check APK signature + Android package manager metadata of BOTH released files
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -x "$signer" && test -x "$aapt"
          for apk in /tmp/aoqat-check/v161/*.apk /tmp/aoqat-check/v160/*.apk; do
             echo "===== CHECKING $apk ====="
             "$signer" verify --verbose --print-certs --min-sdk-version 26 "$apk"
             "$aapt" dump badging "$apk" | head -n 18
          done

  confirm-android-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download exact published v1.61 file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/aoqat-install
          gh release download v1.61-original-hawija-splash --repo "$GH_REPO" --pattern '*.apk' --dir /tmp/aoqat-install
          test "$(stat -c%s /tmp/aoqat-install/*.apk)" -eq 108882167
      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actually install release APK into Android 16 (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r /tmp/aoqat-install/aoqat-v1.61-original-splash.apk
            adb shell pm path com.aoqat.calendar
            adb shell dumpsys package com.aoqat.calendar | grep -m1 'versionName=1.61'
            echo 'PASS: ORIGINAL v1.61 RELEASE APK INSTALLED ON ANDROID EMULATOR'
