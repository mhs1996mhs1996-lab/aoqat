name: Build v2.07 merged iqama and compact quiet signed APK
on:
  push:
    branches: ['fix/v207-quiet-ui-merge-iqama-20261113']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check UI and original settings are preserved
        run: |
          set -euo pipefail
          node --check js/adhan-settings.js
          node --check android-native/apk-overrides/native-quiet-menu.js
          node --check js/web-settings-search-calendar.js
          node --test tests/v203-settings-inbox.test.cjs tests/azkar-reminders.test.cjs tests/web-quiet-core.test.cjs
          python3 - <<'PY'
          from pathlib import Path
          q=Path('android-native/apk-overrides/native-quiet-menu.js').read_text()
          a=Path('js/adhan-settings.js').read_text()
          assert 'data-quiet-adjust' in q and 'data-quiet-preset' not in q
          assert 'panel.appendChild(status)' not in q
          assert 'lang="en" dir="ltr"' in q
          assert 'data-quiet-prayer' in q and 'aq-quiet-stepper' in q
          for k in ['adAudibilityOpen','adAudibilityBack','adAudibilityHelp','adAudibilityDetails','adAudibilityHelpText']:
              assert k in a,k
          assert 'data-ad-audibility' in a and 'data-sound-condition' in a
          assert 'aoqat-help-circle' in a
          menu=Path('js/web-menu-order.js').read_text()
          assert 'aoqatPrayerIqamaEntry' in menu and 'aoqatPrayerQuietEntry' in menu
          assert '["iqama","⏳","إشعار الإقامة"]' not in menu
          assert "versionName '2.07'" in Path('android-native/app/build.gradle').read_text()
          assert 'versionCode 142' in Path('android-native/app/build.gradle').read_text()
          print('PASS: original per-prayer +/- and compact sound controls')
          PY
      - name: Restore original signing key
        run: |
          mkdir -p android-native/signing
          base64 --decode android-native/signing/aoqat-stable-debug.keystore.b64 > android-native/signing/aoqat-stable-debug.keystore
      - name: Android tests and build
        run: gradle -p android-native --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK signature and offline assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/aoqat-v207
          cp android-native/app/build/outputs/apk/debug/app-debug.apk /tmp/aoqat-v207/aoqat-v2.07-quiet-iqama-merge.apk
          apk=/tmp/aoqat-v207/aoqat-v2.07-quiet-iqama-merge.apk
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          "$signer" verify --print-certs "$apk" | tee /tmp/aoqat-v207/signature.txt
          grep -F 'aa72af7eb8b22501686b77e86f6c0bf1c6a1b61378cf67ca705076282357b496' /tmp/aoqat-v207/signature.txt
          "$aapt" dump badging "$apk" | grep -F "versionCode='142' versionName='2.07'"
          python3 - <<'PY'
          import zipfile
          p='/tmp/aoqat-v207/aoqat-v2.07-quiet-iqama-merge.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert len(z.read('assets/www/data/prayer-times-offline.json'))>5000
              bundle=z.read('assets/www/js/apk-startup-bundle.js').decode()
              assert 'adAudibilityBack' in bundle and 'adAudibilityHelp' in bundle
              assert 'aoqatPrayerIqamaEntry' in bundle
              assert 'panel.appendChild(status)' not in bundle
              assert 'data-quiet-adjust' in bundle and 'data-quiet-preset' not in bundle
              assert len([n for n in z.namelist() if n.startswith('assets/www/assets/qcf-v2-page-fonts/p') and n.endswith('.woff2')])==604
          print('PASS: APK signed, original offline prayer DB and 604 Quran pages')
          PY
          sha256sum "$apk" > /tmp/aoqat-v207/checksum.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aoqat-v2.07-quiet-iqama-merge
          path: |
            /tmp/aoqat-v207/aoqat-v2.07-quiet-iqama-merge.apk
            /tmp/aoqat-v207/checksum.sha256
      - name: Publish signed installable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v2.07-quiet-iqama-merge
          if ! gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "أوقات الصلاة في الحويجة v2.07 — ترتيب الصامت والصوت" --notes "إرجاع عداد مدة الصامت لكل صلاة بأزرار زائد وناقص دون مدد جاهزة، ونقل صوت الصلاة أثناء الصامت وعدم الإزعاج إلى زر مستقل مع رجوع ودائرة مساعدة. دون تغيير بقية محتويات المشروع." --prerelease
          fi
          gh release upload "$tag" /tmp/aoqat-v207/aoqat-v2.07-quiet-iqama-merge.apk /tmp/aoqat-v207/checksum.sha256 --repo "$GH_REPO" --clobber
