name: Publish original Hawija splash APK v1.61
on:
  pull_request:
    paths:
      - '.github/workflows/publish-v161-original-splash.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Download fully tested Android v1.61 installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN=41059285774
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN" --jq '.conclusion')" = success
          mkdir -p release
          gh run download "$RUN" --repo "$GH_REPO" --name aoqat-v1.58-qcf-only-apk --dir release
          test -s release/app-debug.apk
          mv release/app-debug.apk release/aoqat-v1.61-original-splash.apk
          python3 - <<'PY'
          import hashlib,zipfile,struct
          path='release/aoqat-v1.61-original-splash.apk'
          with zipfile.ZipFile(path) as z:
              names=z.namelist()
              img=z.read('assets/splash-hawija-original.jpg')
              assert hashlib.sha256(img).hexdigest()=='50c329d2ed32afe65f01f62a06f1655fbee1971a50d72d3f5df7e8947835e3ba'
              assert img[:3]==b'\xff\xd8\xff'
              assert 'assets/splash-hawija-approved.png' not in names
              fonts=[n for n in names if n.startswith('assets/www/assets/qcf-v2-page-fonts/p') and n.endswith('.woff2')]
              assert len(fonts)==604
              print('Exact original splash SHA-256 verified:',len(img),'bytes; 604 QCF fonts')
          PY
          sha256sum release/aoqat-v1.61-original-splash.apk > release/aoqat-v1.61.sha256
      - name: Upload installable v1.61 APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v1.61-original-hawija-splash
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target 430050097f05b66d43b41f0ec95967e90c0fe6f8 --title "أوقات الصلاة في الحويجة 1.61 — صورة البداية الأصلية" --prerelease --notes 'صورة البداية الأصلية نفسها المرسلة في المحادثة محفوظة بلا تغيير وببصمة SHA-256 مطابقة، بدون إعادة رسم أو خلفية مشوهة. مصحف QCF V2 وتعديلات التقاويم السابقة محفوظة. نسخة تجريبية لاختبار الهاتف.'
          fi
          gh release upload "$TAG" release/aoqat-v1.61-original-splash.apk release/aoqat-v1.61.sha256 --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx aoqat-v1.61-original-splash.apk
