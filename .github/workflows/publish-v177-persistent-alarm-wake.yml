name: Verify and publish APK v1.77 persistent snooze and screen wake
on:
  push:
    branches:
      - 'fix/v177-persistent-alarm-screen-wake-20261106'
    paths:
      - '.github/workflows/publish-v177-persistent-alarm-wake.yml'
      - 'android-native/**'
      - 'js/**'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-v177-alarm-snooze
  cancel-in-progress: true
jobs:
  verify-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact reviewed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore original compatible signing key
        run: |
          mkdir -p android-native/signing
          base64 --decode android-native/signing/aoqat-stable-debug.keystore.b64 > android-native/signing/aoqat-stable-debug.keystore
      - name: Verify latest web navigation and notification controls
        run: |
          set -euo pipefail
          node --check js/web-menu-order.js
          node --check js/adhan-settings.js
          node --check js/monthly-calendars.js
          node tests/adhan-core.test.cjs
          node tests/prayer-alarm-core.test.cjs
          test -s android-native/app/src/main/res/layout/notification_alarm_controls.xml
          grep -q 'showSnoozedNotification' android-native/app/src/main/java/com/aoqat/calendar/AlarmCore.kt
          grep -q 'PrayerAlarmNotice.showSnoozed' android-native/app/src/main/java/com/aoqat/calendar/PrayerAlarm.kt
      - name: Run Android tests and build signed installation APK
        run: |
          set -euo pipefail
          gradle -p android-native --no-daemon testDebugUnitTest assembleDebug
      - name: Verify exact version, signature and full offline package
        run: |
          set -euo pipefail
          mkdir -p /tmp/aoqat-v177
          cp android-native/app/build/outputs/apk/debug/app-debug.apk /tmp/aoqat-v177/aoqat-v1.77-persistent-alarm-screen-wake.apk
          apk=/tmp/aoqat-v177/aoqat-v1.77-persistent-alarm-screen-wake.apk
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          "$signer" verify --verbose --print-certs "$apk" | tee /tmp/aoqat-v177/signer.txt
          grep -F 'aa72af7eb8b22501686b77e86f6c0bf1c6a1b61378cf67ca705076282357b496' /tmp/aoqat-v177/signer.txt
          "$aapt" dump badging "$apk" | grep -F "versionCode='112' versionName='1.77'"
          python3 - <<'PY'
          import zipfile,hashlib
          p='/tmp/aoqat-v177/aoqat-v1.77-persistent-alarm-screen-wake.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              n=z.namelist()
              pre='assets/www/'
              assert len([x for x in n if x.startswith(pre+'assets/qcf-v2-page-fonts/p') and x.endswith('.woff2')])==604
              assert len(z.read(pre+'data/prayer-times-offline.json'))>5000
              menu=z.read(pre+'js/web-menu-order.js').decode('utf-8')
              bundle=z.read(pre+'js/apk-startup-bundle.js').decode('utf-8')
              assert 'aoqatAlertScreenWakeV1' in menu and 'configureScreenWake' in menu
              assert 'js/apk-startup-bundle.js' in z.read(pre+'index.html').decode('utf-8')
              assert 'ضبط التنبيهات' in menu and 'القرآن الكريم' in menu
              assert 'configureScreenWake' in bundle
              assert hashlib.sha256(z.read('assets/splash-hawija-original.jpg')).hexdigest()=='50c329d2ed32afe65f01f62a06f1655fbee1971a50d72d3f5df7e8947835e3ba'
              print('PASS: signed v1.77, unchanged 604 offline Quran page fonts, prayer DB, wake preferences, release bundle')
          PY
          sha256sum "$apk" > /tmp/aoqat-v177/aoqat-v1.77.sha256
      - name: Download installed previous signed version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download v1.76-adhan-theme-restore --repo "$GH_REPO" --pattern '*.apk' --dir /tmp/aoqat-v177
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify upgrade on Android 16 without wiping settings
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r /tmp/aoqat-v177/aoqat-v1.76-adhan-theme-restore.apk
            adb shell dumpsys package com.aoqat.calendar | grep -m1 'versionName=1.76'
            adb install -r /tmp/aoqat-v177/aoqat-v1.77-persistent-alarm-screen-wake.apk
            adb shell dumpsys package com.aoqat.calendar | grep -m1 'versionName=1.77'
            adb shell am start -n com.aoqat.calendar/.MainActivity
            sleep 5
            adb shell pidof com.aoqat.calendar
      - name: Publish APK only after successful signed upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=v1.77-persistent-alarm-screen-wake
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --title "أوقات الصلاة في الحويجة v1.77 — إشعارات منبّه ثابتة وإضاءة الشاشة" --prerelease --notes 'نسخة أندرويد v1.77 فوق v1.76: بطاقة المنبه تبقى أثناء الرنين والغفوة وتحتوي إيقاف وغفوة، وإضاءة الشاشة وفق اختيار المستخدم. جميع خدمات الأذان والمواقيت والمصحف محفوظة دون تعديل. قد تختلف إتاحة أزرار الإشعار المطوي وإضاءة الشاشة حسب نظام الهاتف وأذوناته.'
          fi
          gh release upload "$tag" /tmp/aoqat-v177/aoqat-v1.77-persistent-alarm-screen-wake.apk /tmp/aoqat-v177/aoqat-v1.77.sha256 --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx 'aoqat-v1.77-persistent-alarm-screen-wake.apk'
