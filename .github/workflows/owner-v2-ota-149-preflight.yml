name: Owner OTA V2 build 149 preflight - synthetic keys only

on:
  push:
    branches:
      - owner-tools/v2-ota-preflight-149-20261115
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-preflight-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public helper and run disposable-key cryptographic tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile AOQAT-149-OTA-V2-Preflight.py
          grep -F 'BUILD = 149' AOQAT-149-OTA-V2-Preflight.py
          grep -F 'EXPECTED_V2_PUBLIC_SHA256 = "8f6f63bd3074209fa3b375adc455ecc5eeed96abca9e4a52144b49ddd8d7737d"' AOQAT-149-OTA-V2-Preflight.py
          python3 AOQAT-149-OTA-V2-Preflight.py --self-test
          test ! -e aoqat-update-private-v2.pem
          test ! -e aoqat-apk-production-v2.p12
          test ! -e AOQAT_FINAL_KEYS_V2.7z
          echo 'PASS: disposable signer tests only; owner key stays on phone; nothing published'
