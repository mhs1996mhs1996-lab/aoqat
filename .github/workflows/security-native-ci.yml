name: Security APK build verification only - never publish

on:
  push:
    branches: [security/v210-sacred-content-integrity-20261114]
    paths:
      - 'android-native/**'
      - 'security/**'
      - '.github/workflows/security-native-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-verify-dont-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify sacred Quran/prayer data unchanged and old signing file absent
        run: |
          python3 security/check-sacred-content.py
          test ! -e android-native/signing/aoqat-stable-debug.keystore.b64
          test ! -e android-native/signing/aoqat-stable-debug.keystore
      - name: Fail closed on signing-key substitution or downgraded trust-chain
        run: python3 security/check-signed-updater-trust.py
      - name: Compile and test hardened Android using temporary debug certificate only
        run: gradle -p android-native --no-daemon testDebugUnitTest assembleDebug
      - name: Check security version, packaging and prevent reuse of old public certificate
        run: |
          set -euo pipefail
          apk=android-native/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt" dump badging "$apk" | head -1 | tee version.txt
          grep -F "versionCode='146'" version.txt
          grep -F "versionName='2.11-security-test'" version.txt
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" | tee cert.txt
          if grep -Fqi 'aa72af7eb8b22501686b77e86f6c0bf1c6a1b61378cf67ca705076282357b496' cert.txt; then
            echo 'SECURITY FAILURE: compromised historical certificate reused'
            exit 1
          fi
          python3 - <<'PY'
          import zipfile,hashlib,json,pathlib
          apk=pathlib.Path('android-native/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              base='assets/www/'
              fonts=[p for p in z.namelist() if p.startswith(base+'assets/qcf-v2-page-fonts/p') and p.endswith('.woff2')]
              assert len(fonts)==604, len(fonts)
              data=json.loads(z.read(base+'data/prayer-times-offline.json'))
              assert len(data)==366, len(data)
              offline=json.loads(z.read(base+'assets/mushaf-apk-sha256.json'))
              for name,digest in offline.items():
                  archived=base+name+('.bin' if name.endswith('.gz') else '')
                  assert hashlib.sha256(z.read(archived)).hexdigest()==digest, name
          print('CI_ONLY_VERIFIED: 604 offline mushaf page fonts and 366 days of prayer data unchanged')
          PY
      - name: Final release prohibition
        run: |
          echo "No release step, no artifact upload, no signing key in repository."
          echo "Security APK remains a local CI build until owner approves credential migration."
