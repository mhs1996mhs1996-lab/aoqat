name: Verify Android adhan and settings PR
on:
  pull_request:
    paths:
      - 'android-native/**'
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/verify-android-adhan-pr.yml'
permissions:
  contents: read
jobs:
  android-adhan-settings:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate web and APK interfaces
        run: |
          npm install --no-save --package-lock=false playwright
          node tests/notification-settings-layout-browser.cjs
          node tests/apk-day-rollover-browser.cjs
      - name: Prepare signing
        run: |
          mkdir -p android-native/signing
          base64 --decode android-native/signing/aoqat-stable-debug.keystore.b64 > android-native/signing/aoqat-stable-debug.keystore
      - name: Unit tests and APK build
        run: gradle -p android-native --no-daemon testDebugUnitTest assembleDebug
      - name: Retain installable APK for examination
        uses: actions/upload-artifact@v4
        with:
          name: adhan-settings-validation-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
