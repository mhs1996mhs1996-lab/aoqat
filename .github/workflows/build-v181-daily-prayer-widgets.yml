name: Build v1.81 compact daily prayer cards APK
on:
  push:
    branches:
      - 'feature/v181-prayer-times-layouts-20261107'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable original APK signing key
        run: |
          mkdir -p android-native/signing
          base64 --decode android-native/signing/aoqat-stable-debug.keystore.b64 > android-native/signing/aoqat-stable-debug.keystore
      - name: Verify isolated layout variants and critical services
        run: |
          set -euo pipefail
          node --check js/widget-appearance.js
          node tests/adhan-core.test.cjs
          node tests/prayer-alarm-core.test.cjs
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('android-native/app/src/main')
          k=(p/'java/com/aoqat/calendar/PrayerWidget.kt').read_text()
          w=(p/'java/com/aoqat/calendar/WidgetAppearance.kt').read_text()
          j=Path('js/widget-appearance.js').read_text()
          for item in ['classic','grid','featured']:
              assert item in k and item in w and item in j,item
          for name in ['prayer_times_widget_grid','prayer_times_widget_featured']:
              xml=ET.parse(p/f'res/layout/{name}.xml')
              ids=[n.attrib.get('{http://schemas.android.com/apk/res/android}id','') for n in xml.iter()]
              for prayer in ['fajr','sunrise','dhuhr','asr','maghrib','isha']:
                  assert '@+id/widget_times_'+prayer in ids, (name,prayer)
          for f in ['PrayerWidget.kt','WidgetAppearance.kt']:
              assert (p/'java/com/aoqat/calendar'/f).exists()
          assert 'versionCode 116' in Path('android-native/app/build.gradle').read_text()
          assert "versionName '1.81'" in Path('android-native/app/build.gradle').read_text()
          print('PASS: six times in two rows, three styles, user scaling, no audio modifications')
          PY
      - name: Run Android unit tests and compile installable APK
        run: gradle -p android-native --no-daemon testDebugUnitTest assembleDebug
      - name: Verify signature, version and offline data
        run: |
          set -euo pipefail
          mkdir -p /tmp/aoqat-v181
          cp android-native/app/build/outputs/apk/debug/app-debug.apk /tmp/aoqat-v181/aoqat-v1.81-daily-prayer-widgets.apk
          apk=/tmp/aoqat-v181/aoqat-v1.81-daily-prayer-widgets.apk
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          "$signer" verify --print-certs "$apk" | tee /tmp/aoqat-v181/signature.txt
          grep -F 'aa72af7eb8b22501686b77e86f6c0bf1c6a1b61378cf67ca705076282357b496' /tmp/aoqat-v181/signature.txt
          "$aapt" dump badging "$apk" | grep -F "versionCode='116' versionName='1.81'"
          python3 - <<'PY'
          import zipfile
          p='/tmp/aoqat-v181/aoqat-v1.81-daily-prayer-widgets.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert len(z.read('assets/www/data/prayer-times-offline.json'))>5000
              assert len([n for n in z.namelist() if n.startswith('assets/www/assets/qcf-v2-page-fonts/p') and n.endswith('.woff2')])==604
          print('PASS: verified signed APK + complete offline prayer database and Quran')
          PY
          sha256sum "$apk" > /tmp/aoqat-v181/checksum.sha256
      - name: Upload tested APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoqat-v1.81-daily-prayer-widgets
          path: |
            /tmp/aoqat-v181/aoqat-v1.81-daily-prayer-widgets.apk
            /tmp/aoqat-v181/checksum.sha256
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v1.81-daily-prayer-widgets
          if ! gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "أوقات الصلاة في الحويجة v1.81 — بطاقات المواقيت" --notes "ثلاثة تصاميم للمواقيت اليومية: القائمة القديمة، شبكة مدمجة 3+3، وشبكة مميزة؛ تتضمن الفجر والشروق والظهر والعصر والمغرب والعشاء، قابلة لتخصيص الخط واللون والحجم. تصغير بطاقة الصلاة القادمة والإقامة. توقيت الأذان وقاعدة البيانات والمصحف بدون تعديل." --prerelease
          fi
          gh release upload "$tag" /tmp/aoqat-v181/aoqat-v1.81-daily-prayer-widgets.apk /tmp/aoqat-v181/checksum.sha256 --repo "$GH_REPO" --clobber
