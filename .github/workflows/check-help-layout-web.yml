name: Verify web help icons do not break settings
on:
  workflow_dispatch:
  push:
    paths:
      - 'js/settings-help-live.js'
      - 'js/web-menu-order.js'
      - 'css/adhan.css'
      - 'tests/help-layout-regression-browser.cjs'
      - '.github/workflows/check-help-layout-web.yml'
permissions:
  contents: read
jobs:
  help-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript parses
        run: |
          node --check js/settings-help-live.js
          node --check js/web-menu-order.js
          node --check tests/help-layout-regression-browser.cjs
      - name: Verify the real prayer settings layout in Chrome
        run: |
          npm install --no-save --package-lock=false playwright
          node tests/help-layout-regression-browser.cjs
      - name: Attach a safe layout screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adhan-settings-help-safe
          path: /tmp/aoqat-help-adhan-safe.png
          if-no-files-found: ignore
