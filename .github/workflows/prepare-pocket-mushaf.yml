name: Prepare compact Hafs web pages
on:
  push:
    branches: ['quran-pocket-hafs-web']
    paths: ['scripts/render-pocket-hafs.py', '.github/workflows/prepare-pocket-mushaf.yml']
permissions:
  contents: write
jobs:
  pocket-pages:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Render and register verified pocket publication
        run: |
          python -m pip install PyMuPDF==1.26.6 Pillow==12.3.0 opencv-python-headless==4.13.0.92
          python scripts/render-pocket-hafs.py
      - name: Check pocket pages and web reader
        run: |
          npm install --no-save --package-lock=false playwright
          node --test tests/quran-pages.test.cjs tests/quran-original-pages.test.cjs tests/quran-pocket-pages.test.cjs
          node tests/quran-reader-browser.cjs
          node tests/quran-offline-browser.cjs
      - name: Preserve verified web assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mushaf-hafs-pocket assets/mushaf-hafs-pocket-ready.json assets/mushaf-hafs-pocket.json.gz
          git commit -m 'Bundle all 604 verified KFGQPC pocket Hafs pages for web'
          git push origin HEAD:quran-pocket-hafs-web
      - name: Upload pocket-page previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-hafs-web-previews
          path: /tmp/aoqat-original-*.png
          if-no-files-found: ignore
