name: Publish QCF v1.58 test installer
on:
  push:
    branches: [fix/apk-qcf-only-offline-20261030]
    paths: ['.github/workflows/publish-qcf-v158-preview.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Retrieve successfully verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN=41015141155
          test "$(gh api repos/$GH_REPO/actions/runs/$RUN --jq .conclusion)" = success
          mkdir -p release
          gh run download "$RUN" --repo "$GH_REPO" --name aoqat-v1.58-qcf-only-apk --dir release
          test -s release/app-debug.apk
          mv release/app-debug.apk release/aoqat-v1.58-qcf-fixes-preview.apk
          sha256sum release/aoqat-v1.58-qcf-fixes-preview.apk > release/sha256.txt
      - name: Publish installable preview (approved portrait not yet bundled)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v1.58-qcf-quiet-calendar-preview
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target  c7f73fc30f00f248f075876987e3075324efaa82 --title "أوقات الصلاة 1.58 - تجربة إصلاحات المصحف والصامت والتقاويم" --prerelease --notes 'نسخة اختبار: مصحف QCF V2 واحد أوفلاين وإصلاح الصامت والتقاويم. صورة شاشة البداية المعتمدة غير مضافة بعد؛ ليست الإصدار النهائي.'
          fi
          gh release upload "$TAG" release/aoqat-v1.58-qcf-fixes-preview.apk release/sha256.txt --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'aoqat-v1.58-qcf-fixes-preview.apk'
