name: Main B154 original model-1 palette QA
on:
  push:
    branches: [fix/main-b154-exact-preview-icons-20261124]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify original images and limited changes
        run: |
          python3 security/check-no-private-keys.py
          python3 security/check-sacred-content.py
          python3 - <<'PY'
          import subprocess
          expected=["android-native/app/src/main/java/com/aoqat/calendar/PrayerWidget.kt","android-native/app/src/main/res/layout/notification_lock_next.xml","android-native/app/src/main/java/com/aoqat/calendar/LockScreenTextStyle.kt","android-native/app/src/main/java/com/aoqat/calendar/PrayerNotifications.kt","android-native/app/src/main/java/com/aoqat/calendar/AdhanPlaybackService.kt","android-native/app/src/main/java/com/aoqat/calendar/LockNotificationIcon.kt","android-native/app/build.gradle","android-native/app/src/main/res/drawable-nodpi/pilot_notify_exact_adhan.webp","android-native/app/src/main/res/drawable-nodpi/pilot_notify_exact_elapsed.webp",".github/workflows/main-b154-exact-preview-qa.yml"]
          changed=subprocess.check_output(['git','diff','--name-only','ca198f133850fb20657d3ea326959c588331b742','HEAD'],text=True).splitlines()
          assert set(changed)==set(expected), changed
          for path,sha in [["android-native/app/src/main/res/drawable-nodpi/pilot_notify_exact_adhan.webp","3a8cfe7e9dbb9a9d2239de65e23bad4af95431e6"],["android-native/app/src/main/res/drawable-nodpi/pilot_notify_exact_elapsed.webp","50e657ddf151030c46b5a16e15184608cbe9ea06"],["android-native/app/src/main/res/drawable-nodpi/pilot_notify_exact_wait.webp","d8b96e136965f2b362afc2d01286125918a4276b"]]:
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Test and assemble unsigned main APK only
        run: gradle -p android-native --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aoqat-main-b154-unsigned-review
          path: android-native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
