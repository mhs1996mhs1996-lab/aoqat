name: Publish verified offline APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-apk-release.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/39822974230/jobs --jq '.jobs[] | select(.name == "build-apk") | .conclusion')" = success
          mkdir -p release
          gh run download 39822974230 --name aoqat-android-v1.51-build86 --dir release
          mv release/app-debug.apk release/aoqat-v1.51.apk
      - name: Verify release bytes and signing certificate
        run: |
          echo '74fb3e04fa2dce09253e0c72714b0fafa5afaeb48dd07b1accb3e5c2c18285d2  release/aoqat-v1.51.apk' | sha256sum --check
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$signer" verify --print-certs release/aoqat-v1.51.apk > release/signature.txt
          grep -F 'aa72af7eb8b22501686b77e86f6c0bf1c6a1b61378cf67ca705076282357b496' release/signature.txt
      - name: Publish installation file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release/notes.txt <<'NOTES'
          الإصدار 1.51: فتح البوصلة مباشرة مع زر رجوع؛ دمج تعديلات الويب وأذان قباء؛ معالجة مقاطعة الأذان المؤقتة وفقد بدء التشغيل؛ تنبيهات الأذكار بالخلفية مع صوت إشعار؛ تنبيه نشر الغد متوقف افتراضياً مع إيقاف فعلي وواجهة منبّه على شاشة القفل. المصحف وقاعدة المواقيت كاملان دون إنترنت. ثبّت التحديث فوق النسخة الحالية للحفاظ على إعداداتك.
          NOTES
          gh release create v1.51 release/aoqat-v1.51.apk --target 7fb3d51a1aedcacd4248089724e6a96189ab6748 --title 'أوقات الصلاة في الحويجة 1.51' --notes-file release/notes.txt
