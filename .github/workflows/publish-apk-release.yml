name: Publish verified offline APK
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Android APK']
    types: [completed]
  push:
    paths:
      - '.github/workflows/publish-apk-release.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-aoqat-v1.58
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id || '0' }}"
          test "$RUN_ID" != 0 || { echo 'Only completed build runs may publish'; exit 1; }
          test "$(gh api repos/$GH_REPO/actions/runs/$RUN_ID/jobs --jq '.jobs[] | select(.name == "build-apk") | .conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$RUN_ID/jobs --jq '.jobs[] | select(.name == "release-checks") | .conclusion')" = success
          mkdir -p release
          gh run download "$RUN_ID" --name aoqat-android-v1.58-build93 --dir release
          mv release/app-debug.apk release/aoqat-v1.58.apk
      - name: Verify release bytes and signing certificate
        run: |
          test -s release/aoqat-v1.58.apk
          sha256sum release/aoqat-v1.58.apk > release/aoqat-v1.58.sha256
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$signer" verify --print-certs release/aoqat-v1.58.apk > release/signature.txt
          grep -F 'aa72af7eb8b22501686b77e86f6c0bf1c6a1b61378cf67ca705076282357b496' release/signature.txt
      - name: Publish installation file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh auth status
          gh api "repos/$GH_REPO" --jq '{name,permissions}'
          cat > release/notes.txt <<'NOTES'
          الإصدار 1.58: استقلال الأذان والمنبّه والإشعار لكل صلاة، التحكم بالصوت وقت الصامت وعدم الإزعاج لكل صلاة، وتحسين دقة التنبيهات والتشغيل عند الإقامة واستعادة وضع الهاتف السابق. الإصدار يتطلب تثبيت APK؛ المصحف والمواقيت والتقاويم وملفات الويب لم تتغير. الاختبارات الآلية لا تستبدل اختبار الرنين على الهواتف المختلفة.
          NOTES
          if ! gh release view v1.58 >/dev/null 2>&1; then
            gh release create v1.58 --target "${{ github.event.workflow_run.head_sha }}" --title 'أوقات الصلاة في الحويجة 1.56' --notes-file release/notes.txt
          fi
          for attempt in 1 2 3; do
            if gh release upload v1.58 release/aoqat-v1.58.apk release/aoqat-v1.58.sha256 --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
          gh release view v1.58 --json assets --jq '.assets[].name' | grep -Fx 'aoqat-v1.58.apk'
# Publish only a verified v1.58 APK from a successful main-branch Android build
