name: Publish verified offline APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-apk-release.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          gh run download 38036108306 --name aoqat-android-v1.43-build78 --dir release
          mv release/app-debug.apk release/aoqat-v1.43.apk
      - name: Verify release bytes and signing certificate
        run: |
          echo '8af4a9c2a2953b0f97f3974825b4ad6a10245e3fabac4d3671cd5141a71c5a54  release/aoqat-v1.43.apk' | sha256sum --check
          signer=$(rg --files "$ANDROID_HOME/build-tools" | rg '/apksigner$' | sort | tail -1)
          "$signer" verify --print-certs release/aoqat-v1.43.apk > release/signature.txt
          grep -F 'aa72af7eb8b22501686b77e86f6c0bf1c6a1b61378cf67ca705076282357b496' release/signature.txt
      - name: Publish installation file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release/notes.txt <<'NOTES'
          الإصدار 1.43: قاعدة مواقيت سنوية محفوظة، مزامنة تلقائية للأيام الثمانية، ومصحف كامل يعمل دون الإنترنت. يشمل آخر إضافات المصحف والحفظ السريع وخدمات الأذان والتنبيه والجمعة. ثبّت التحديث فوق النسخة الحالية للحفاظ على إعداداتك.
          NOTES
          gh release create v1.43 release/aoqat-v1.43.apk --target f0766098b40120daa66ecbe7e96be24a16b7572c --title 'أوقات الصلاة في الحويجة 1.43' --notes-file release/notes.txt
