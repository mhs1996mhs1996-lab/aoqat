<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة خط المصحف — الصفحة الثالثة</title><style>
@font-face{font-family:UthmanicHafs;src:url("https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2") format("woff2");font-display:swap}
@font-face{font-family:QCF3;src:url("https://verses.quran.foundation/fonts/quran/hafs/v2/woff2/p3.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f4f0e6;color:#241b13;font-family:system-ui,Tahoma,sans-serif}.toolbar{padding:12px 14px;background:#fff;position:sticky;top:0;z-index:2;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar a,.toolbar button{border:1px solid #a9936d;border-radius:9px;background:#fff9eb;color:#483820;padding:8px 12px;text-decoration:none;font-size:14px}.toolbar button[aria-pressed=true]{background:#d9c398}.hint{font-size:12px;line-height:1.7;color:#66543b;padding:10px 16px;max-width:680px;margin:auto}.paper{background:#fffaf0;max-width:690px;min-height:78vh;margin:8px auto 20px;padding:22px 18px 36px;border:1px solid #ddc8a7;box-shadow:0 2px 12px #51402416}.head{display:flex;justify-content:space-between;color:#9a7854;font-size:15px}.ayah{font:clamp(27px,6.2vw,44px)/2.05 UthmanicHafs,serif;text-align:justify;direction:rtl;margin-top:18px;word-spacing:1px}.marker{font-family:UthmanicHafs,serif;color:#a57942;white-space:nowrap}.foot{text-align:center;color:#a57942;margin-top:20px}.loading{font-size:14px;color:#82694b}.error{color:#a32d2d}.source{font-size:12px;text-align:center;color:#816a50;margin-top:14px}@media(max-width:420px){.paper{padding:18px 12px 24px}.ayah{font-size:clamp(25px,6.3vw,32px);line-height:2.15}}.qcf-lines{display:grid;grid-template-rows:repeat(15,minmax(0,1fr));height:calc(100dvh - 180px);min-height:540px;max-height:1050px;margin-top:12px;direction:rtl}.qcf-line{display:flex;direction:rtl;justify-content:space-between;align-items:center;white-space:nowrap;min-width:0;overflow:visible;gap:0;font:clamp(22px,5.1vw,34px)/1 QCF3,serif}.qcf-word{font-family:QCF3,serif;white-space:pre;flex:0 0 auto}.qcf-end{font:inherit;color:#a77d48;white-space:nowrap;flex:0 0 auto}.qcf-line:has(.qcf-end){letter-spacing:0}@media(max-width:420px){.paper{padding-inline:10px}.qcf-line{font-size:clamp(20px,5.1vw,27px)}}body{height:100dvh;overflow:hidden;background:#fffaf0}.paper{width:100%;max-width:690px;height:100dvh;min-height:0;margin:0 auto;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);border:0;box-shadow:none;display:flex;flex-direction:column}.head{flex:0 0 48px;align-items:center}.qcf-lines{flex:1;min-height:0!important;max-height:none!important;height:auto!important;margin:0!important;grid-template-rows:repeat(15,minmax(0,1fr))}.qcf-line{font-size:clamp(18px,5.0vw,31px)!important}.foot{flex:0 0 32px;margin:0;display:flex;align-items:center;justify-content:center}.source{position:absolute;left:8px;right:8px;bottom:35px;background:#fffaf0ee;font-size:10px;opacity:.0;pointer-events:none}.source:has(+ .missing){opacity:1}@media(max-width:420px){.paper{padding-inline:9px}} </style></head><body><main class="paper"><div class="head"><span>الجزء الأول</span><span>البقرة</span></div><div id="text" class="ayah"><span class="loading">جاري تحميل نص الصفحة الثالثة…</span></div><div class="foot">﴿ ٣ ﴾</div><div id="status" class="source"></div></main><script>
const el=document.getElementById('text'),status=document.getElementById('status');
const digit=n=>String(n).replace(/[0-9]/g,x=>'٠١٢٣٤٥٦٧٨٩'[+x]);
async function load(){
 el.innerHTML='<span class="loading">جاري تحميل بيانات QCF V2 للصفحة الثالثة…</span>';
 try{
  const response=await fetch('https://api.quran.com/api/v4/verses/by_page/3?words=true&word_fields=code_v2%2Ctext_uthmani&per_page=50&mushaf=1');
  if(!response.ok)throw Error('واجهة بيانات QCF غير متاحة: '+response.status);
  const data=await response.json();
  const words=(data.verses||[]).flatMap(v=>v.words||[]);
  if(!words.length||words.some(w=>!w.line_number||!w.code_v2))throw Error('بيانات الحروف أو أرقام الأسطر غير مكتملة');
  if(!words.some(w=>w.verse_key==='2:6'||w.text_uthmani==='إِنَّ')){ /* Keep checking via actual page number below. */ }
  const lines=new Map();
  for(const w of words){if(w.page_number&&w.page_number!==3)throw Error('رقم الصفحة غير مطابق');if(!lines.has(w.line_number))lines.set(w.line_number,[]);lines.get(w.line_number).push(w)}
  if(lines.size<12||lines.size>16)throw Error('عدد الأسطر غير متوقع: '+lines.size);
  el.replaceChildren();el.className='qcf-lines';
  for(const [n,ws] of [...lines].sort((a,b)=>a[0]-b[0])){
   const line=document.createElement('div');line.className='qcf-line';line.setAttribute('aria-label','السطر '+digit(n));
   for(const w of ws){const span=document.createElement('span');const end=w.char_type_name==='end';span.className=end?'qcf-end':'qcf-word';span.textContent=w.code_v2;line.append(span)}
   el.append(line);
  }
  await document.fonts.load('34px QCF3');
  const head=document.querySelector('.head'),foot=document.querySelector('.foot');
  const available=Math.max(1,window.innerHeight-head.offsetHeight-foot.offsetHeight-8);
  el.style.height=available+'px';
  for(const line of el.children){const spans=[...line.children];if(!spans.length)continue;let size=32;line.style.fontSize=size+'px';while(size>18&&line.scrollWidth>line.clientWidth+2){size-=.5;line.style.fontSize=size+'px'}if(line.scrollWidth>line.clientWidth+2)line.style.justifyContent='flex-start';}
  status.textContent='تجربة QCF V2: إصلاح تكرار رموز نهاية الآيات، وتقليل الفراغات، وضبط عرض أسطر الصفحة الثالثة.';
 }catch(e){
  el.className='ayah';el.innerHTML='<span class="error">تعذر تحميل بيانات QCF V2 المطلوبة. لم نستبدل الخط بنص مختلف ولم نغيّر المصحف الأصلي.</span>';
  status.textContent=String(e.message)+' — قد تكون واجهة Quran.com بحاجة إلى صلاحية أو تمنع الاتصال من المتصفح.';
 }
}
load();
</script></body></html>
