<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة خط المصحف — الصفحة الثالثة</title><style>
@font-face{font-family:UthmanicHafs;src:url("https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2") format("woff2");font-display:swap}
@font-face{font-family:QCF3;src:url("https://verses.quran.foundation/fonts/quran/hafs/v2/woff2/p3.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f4f0e6;color:#241b13;font-family:system-ui,Tahoma,sans-serif}.toolbar{padding:12px 14px;background:#fff;position:sticky;top:0;z-index:2;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar a,.toolbar button{border:1px solid #a9936d;border-radius:9px;background:#fff9eb;color:#483820;padding:8px 12px;text-decoration:none;font-size:14px}.toolbar button[aria-pressed=true]{background:#d9c398}.hint{font-size:12px;line-height:1.7;color:#66543b;padding:10px 16px;max-width:680px;margin:auto}.paper{background:#fffaf0;max-width:690px;min-height:78vh;margin:8px auto 20px;padding:22px 18px 36px;border:1px solid #ddc8a7;box-shadow:0 2px 12px #51402416}.head{display:flex;justify-content:space-between;color:#9a7854;font-size:15px}.ayah{font:clamp(27px,6.2vw,44px)/2.05 UthmanicHafs,serif;text-align:justify;direction:rtl;margin-top:18px;word-spacing:1px}.marker{font-family:UthmanicHafs,serif;color:#a57942;white-space:nowrap}.foot{text-align:center;color:#a57942;margin-top:20px}.loading{font-size:14px;color:#82694b}.error{color:#a32d2d}.source{font-size:12px;text-align:center;color:#816a50;margin-top:14px}@media(max-width:420px){.paper{padding:18px 12px 24px}.ayah{font-size:clamp(25px,6.3vw,32px);line-height:2.15}}</style></head><body><div class="toolbar"><a href="/">الرجوع للتطبيق</a><strong>تجربة الخط — صفحة ٣</strong><button id="reload">إعادة الفحص</button></div><div class="hint">تجربة مستقلة للمقارنة: الخط العثماني الرسمي وعلامات الآيات. ملف QCF V2 للصفحة الثالثة يُحمّل للفحص فقط؛ عرضه الكامل يحتاج بيانات code_v2 المطابقة، لذلك لا نعرض رموزاً غير صحيحة على أنها قرآن.</div><main class="paper"><div class="head"><span>الجزء الأول</span><span>البقرة</span></div><div id="text" class="ayah"><span class="loading">جاري تحميل نص الصفحة الثالثة…</span></div><div class="foot">﴿ ٣ ﴾</div><div id="status" class="source"></div></main><script>
const el=document.getElementById('text'),status=document.getElementById('status');
const digit=n=>String(n).replace(/[0-9]/g,x=>'٠١٢٣٤٥٦٧٨٩'[+x]);
async function load(){try{const [q,meta]=await Promise.all([fetch('/assets/quran.json').then(r=>r.json()),fetch('/assets/quran-pages.json').then(r=>r.json())]);const all=q.flatMap(s=>s.verses.map(v=>({s:s.id,a:v.id,t:v.text})));const start=meta.pages[2].start,end=meta.pages[3].start;const v=all.slice(start,end);if(!v.length||v[0].s!==2||v[0].a!==6)throw Error('تعذر التحقق من بداية الصفحة');el.replaceChildren();for(const verse of v){const span=document.createElement('span');span.textContent=verse.t+' ';el.append(span);const mark=document.createElement('span');mark.className='marker';mark.textContent='۝'+digit(verse.a)+' ';el.append(mark)}status.textContent='المصدر: نص القرآن المخزّن بالمشروع — تجربة عرض بخط UthmanicHafs (ليست QCF V2 مكتملة)';try{await Promise.all([document.fonts.load('30px UthmanicHafs'),document.fonts.load('30px QCF3')]);status.textContent+=' | تم اختبار تحميل ملفَي الخط'}catch(_){status.textContent+=' | قد يتعذر تحميل الخط الخارجي على بعض الأجهزة'}}catch(e){el.innerHTML='<span class="error">تعذر تحميل بيانات الصفحة الثالثة. لم يتم تعديل المصحف الأصلي.</span>';status.textContent=String(e.message)}}document.getElementById('reload').onclick=load;load();</script></body></html>
