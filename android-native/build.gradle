plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}

def fixedIconSource = file('app/src/main/app_icon.b64')
def fixedIconOutput = file('app/src/main/res/drawable/app_icon.jpg')

tasks.register('prepareFixedAppIcon') {
    inputs.file(fixedIconSource)
    outputs.file(fixedIconOutput)
    doLast {
        fixedIconOutput.parentFile.mkdirs()
        fixedIconOutput.bytes = fixedIconSource.text.trim().decodeBase64()
    }
}

project(':app') {
    afterEvaluate {
        tasks.named('preBuild').configure {
            dependsOn rootProject.tasks.named('prepareFixedAppIcon')
        }
    }
}
