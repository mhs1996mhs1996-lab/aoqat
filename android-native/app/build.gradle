plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aoqat.calendar'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile file('../signing/aoqat-stable-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.aoqat.calendar'
        minSdk 26
        // Keep the app content inside the normal system-bar-safe area.
        targetSdk 34
        versionCode 18
        versionName '1.16'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
        }
    }
}

// Android-only packaging: copy the original web project unchanged into the APK,
// then add a small APK-only compatibility layer. The source web files are never edited.
def webSourceRoot = rootProject.projectDir.parentFile
def webAssetDir = file("$projectDir/src/main/assets/www")
def apkOverrideRoot = file("$rootProject.projectDir/apk-overrides")

tasks.register('syncWebAssets', Sync) {
    from(webSourceRoot) {
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'data/**'
        include 'assets/**'
        include 'pages/**'
        include 'manifest.webmanifest'
    }
    from(apkOverrideRoot) {
        include 'android-ui-fixes.js'
        into 'js'
    }
    into(webAssetDir)

    doLast {
        def indexFile = file("$webAssetDir/index.html")
        if (indexFile.exists()) {
            def html = indexFile.getText('UTF-8')
            def tag = '<script src="js/android-ui-fixes.js"></script>'
            if (!html.contains(tag)) {
                html = html.replace('</body>', "${tag}\n</body>")
                indexFile.write(html, 'UTF-8')
            }
        }
    }
}

preBuild.dependsOn(tasks.named('syncWebAssets'))

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
