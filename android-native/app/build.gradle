plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aoqat.calendar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aoqat.calendar'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

// Android-only packaging: copy a snapshot of the existing web project into the APK
// at build time. The original web files are never modified.
def webSourceRoot = rootProject.projectDir.parentFile
def webAssetDir = file("$projectDir/src/main/assets/www")

tasks.register('syncWebAssets', Sync) {
    from(webSourceRoot) {
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'data/**'
        include 'assets/**'
        include 'pages/**'
        include 'manifest.webmanifest'
    }
    into(webAssetDir)
}

preBuild.dependsOn(tasks.named('syncWebAssets'))

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
