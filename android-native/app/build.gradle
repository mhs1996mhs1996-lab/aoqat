plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aoqat.calendar'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile file('../signing/aoqat-stable-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.aoqat.calendar'
        minSdk 26
        targetSdk 34
        versionCode 77 // Compact prayer alarm menu
        versionName '1.42'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions { unitTests.includeAndroidResources = true }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
        }
    }
}

def webSourceRoot = rootProject.projectDir.parentFile
def webAssetDir = file("$projectDir/src/main/assets/www")
def apkOverrideRoot = file("$rootProject.projectDir/apk-overrides")

tasks.register('syncWebAssets', Sync) {
    from(webSourceRoot) {
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'data/**'
        include 'assets/**'
        exclude 'assets/mushaf-hafs-*', 'assets/mushaf-hafs-*/**', 'assets/mushaf-phone-*', 'assets/mushaf-phone-*/**'
        include 'pages/**'
        include 'manifest.webmanifest'
    }
    from(webSourceRoot) {
        include 'assets/mushaf-phone-hafs-ready.json', 'assets/mushaf-phone-hafs.json.gz'
        include 'assets/mushaf-hafs-pocket-ready.json', 'assets/mushaf-hafs-pocket.json.gz'
        include 'assets/mushaf-phone-hafs/**'
        include 'assets/mushaf-hafs-pocket/**'
    }
    from(apkOverrideRoot) {
        include 'android-ui-fixes.js', 'android-back-navigation.js'
        into 'js'
    }
    into(webAssetDir)

    doLast {
        // Integrate tested web services without modifying the hosted web build.
        exec { commandLine 'python3', file("$rootProject.projectDir/prepare-web-assets.py"), webAssetDir }

        def indexFile = file("$webAssetDir/index.html")
        if (indexFile.exists()) {
            def html = indexFile.getText('UTF-8')
            def tag = '<script src="js/android-ui-fixes.js"></script><script src="js/android-back-navigation.js"></script>'
            if (!html.contains(tag)) {
                html = html.replace('</body>', "${tag}\n</body>")
                indexFile.write(html, 'UTF-8')
            }
        }
    }
}

preBuild.dependsOn(tasks.named('syncWebAssets'))

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
