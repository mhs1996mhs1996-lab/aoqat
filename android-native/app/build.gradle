plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aoqat.calendar'
    compileSdk 35

    // Never use the publicly exposed historical debug keystore again.
    // CI debug builds use their own temporary debug key. A real upgrade to
    // installed 2.10 requires a separately secured signing migration.
    def signingEnv = [
        'AOQAT_APK_SIGNING_KEYSTORE_FILE',
        'AOQAT_APK_SIGNING_STORE_PASSWORD',
        'AOQAT_APK_SIGNING_KEY_ALIAS',
        'AOQAT_APK_SIGNING_KEY_PASSWORD'
    ]
    def signingConfigured = signingEnv.every { System.getenv(it) }
    if (signingEnv.any { System.getenv(it) } && !signingConfigured) {
        throw new GradleException('Incomplete secure APK signing environment')
    }
    signingConfigs {
        if (signingConfigured) {
            secureUpgrade {
                storeFile file(System.getenv('AOQAT_APK_SIGNING_KEYSTORE_FILE'))
                storePassword System.getenv('AOQAT_APK_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('AOQAT_APK_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('AOQAT_APK_SIGNING_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId 'com.aoqat.calendar'
        minSdk 26
        targetSdk 34
        versionCode 146 // Isolated security trial; NOT published for installation until signing migration
        versionName '2.11-security-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            testLogging {
                exceptionFormat = 'full'
                showStackTraces = true
                showExceptions = true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // For local/CI testing only; ephemeral debug certificate cannot
            // silently overwrite existing v2.10 installations.
            if (signingConfigured) signingConfig signingConfigs.secureUpgrade
            else signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (signingConfigured) signingConfig signingConfigs.secureUpgrade
        }
    }
}

def webSourceRoot = rootProject.projectDir.parentFile
def webAssetDir = file("$projectDir/src/main/assets/www")
def apkOverrideRoot = file("$rootProject.projectDir/apk-overrides")

tasks.register('syncWebAssets', Sync) {
    from(webSourceRoot) {
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'data/**'
        include 'assets/**'
        exclude 'assets/mushaf-phone-*', 'assets/mushaf-phone-*/**'
        // No legacy SVG Quran folio assets: QCF V2 is the only packaged edition.
        exclude 'pages/**', 'assets/mushaf-phone-hafs/**', 'assets/mushaf-hafs-*/**', 'assets/mushaf-tajwid*/**'
        include 'manifest.webmanifest'
    }
    from(webSourceRoot) {
        include 'assets/mushaf-phone-hafs-ready.json', 'assets/mushaf-phone-hafs.json.gz'
        // Only the page index/verse metadata is needed by the QCF reader.
    }
    from(webSourceRoot) {
        include 'experiments/qcf604-web-verse-layouts.json.gz'
    }
    from(apkOverrideRoot) {
        include 'android-ui-fixes.js', 'android-back-navigation.js', 'native-reminders.js'
        into 'js'
    }
    into(webAssetDir)

    doLast {
        // Integrate tested web services without modifying the hosted web build.
        exec { commandLine 'python3', file("$rootProject.projectDir/prepare-web-assets.py"), webAssetDir }
        exec { commandLine 'python3', file("$rootProject.projectDir/download-qcf-fonts.py"), webAssetDir }

        def indexFile = file("$webAssetDir/index.html")
        if (indexFile.exists()) {
            def html = indexFile.getText('UTF-8')
            def tag = '<script src="js/android-ui-fixes.js"></script><script src="js/android-back-navigation.js"></script>'
            if (!html.contains(tag)) {
                html = html.replace('</body>', "${tag}\n</body>")
                indexFile.write(html, 'UTF-8')
            }
        }
    }
}

preBuild.dependsOn(tasks.named('syncWebAssets'))

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.webkit:webkit:1.18.0' // Local HTTPS appassets origin; no runtime server
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}



