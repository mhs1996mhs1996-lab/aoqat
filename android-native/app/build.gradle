plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aoqat.calendar'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile file('../signing/aoqat-stable-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.aoqat.calendar'
        minSdk 26
        // Keep the app content inside the normal system-bar-safe area.
        // targetSdk 35 forces edge-to-edge on recent Android versions,
        // which caused the web header to sit under the clock/network/battery bar.
        targetSdk 34
        versionCode 15
        versionName '1.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
        }
    }
}

// Android-only packaging: copy the existing web project into the APK at build time.
// No CSS/JS/layout overrides are injected here, so the APK interface keeps the
// same responsive sizing rules as the web version. Original web files are untouched.
def webSourceRoot = rootProject.projectDir.parentFile
def webAssetDir = file("$projectDir/src/main/assets/www")

tasks.register('syncWebAssets', Sync) {
    from(webSourceRoot) {
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'data/**'
        include 'assets/**'
        include 'pages/**'
        include 'manifest.webmanifest'
    }
    into(webAssetDir)
}

preBuild.dependsOn(tasks.named('syncWebAssets'))

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
